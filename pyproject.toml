[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diapason"
dynamic = ["version"]
description = "Reproducible evaluation harness for audio language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Chen Ze", email = "245748060+naivestud@users.noreply.github.com" },
]
keywords = [
  "audio",
  "speech-recognition",
  "evaluation",
  "benchmark",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "types-PyYAML>=6.0.12.20260724",
]

[project.scripts]
diapason = "diapason.cli:main"

[tool.hatch.version]
path = "src/diapason/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diapason"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
