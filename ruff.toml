# Ruff configuration for diapason.
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long; the formatter handles wrapping
]

[lint.isort]
known-first-party = ["diapason"]

[format]
quote-style = "double"
indent-style = "space"
